name: GEO News Watch

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: geo-news-watch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore monitor state
        shell: bash
        run: |
          if git fetch origin monitor-state:monitor-state; then
            git show monitor-state:state/site_state.json > state/site_state.json || true
            echo "Restored monitor state from monitor-state branch."
          else
            echo "No monitor-state branch yet. Using committed starter state."
          fi

      - name: Run monitor
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python scripts/monitor.py

      - name: Export summary
        id: summary
        shell: bash
        run: |
          echo "has_changes=$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('output/summary.json').read_text(encoding='utf-8'))
          print(str(data['has_changes']).lower())
          PY
          )" >> "$GITHUB_OUTPUT"
          echo "report_date=$(python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('output/summary.json').read_text(encoding='utf-8'))
          print(data['generated_at'][:10])
          PY
          )" >> "$GITHUB_OUTPUT"

      - name: Create issue
        if: steps.summary.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_DATE: ${{ steps.summary.outputs.report_date }}
        run: |
          gh issue create \
            --title "GEO News Watch - ${REPORT_DATE}" \
            --label "geo-news-watch" \
            --label "monitoring" \
            --body-file output/report.md

      - name: Commit refreshed state to monitor-state branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git diff --quiet -- state/site_state.json && git show-ref --verify --quiet refs/heads/monitor-state; then
            echo "No state changes to commit."
            exit 0
          fi
          STATE_WORKTREE="$(mktemp -d)"
          if git show-ref --verify --quiet refs/heads/monitor-state; then
            git worktree add "$STATE_WORKTREE" monitor-state
          else
            git worktree add -b monitor-state "$STATE_WORKTREE"
          fi
          mkdir -p "$STATE_WORKTREE/state"
          cp state/site_state.json "$STATE_WORKTREE/state/site_state.json"
          cd "$STATE_WORKTREE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/site_state.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh GEO monitor state"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" monitor-state
