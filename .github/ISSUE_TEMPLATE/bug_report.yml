name: Bug report
description: Report a monitor bug or noisy result
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include source URL, report date, and expected behavior.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste safe logs only. Do not paste secrets or private data.
      render: shell
